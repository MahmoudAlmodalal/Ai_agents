<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدليل الهندسي الشامل: بناء وبرمجة المشاريع ونمذجة الأنظمة بالذكاء الاصطناعي</title>
  <meta name="description" content="مرجع هندسي شامل ومفصل مقسم موضوعياً: من استنطاق الفكرة ووثيقة PRD والمخططات الهندسية الثمانية (UML & ERD) إلى هندسة قواعد البيانات وتصميم الواجهات وتطوير الفرونت إند.">
  <meta property="og:title" content="الدليل الهندسي الشامل: بناء وبرمجة المشاريع ونمذجة الأنظمة بالذكاء الاصطناعي">
  <meta property="og:description" content="مرجع هندسي شامل ومفصل مقسم موضوعياً: من استنطاق الفكرة ووثيقة PRD والمخططات الهندسية الثمانية (UML & ERD) إلى هندسة قواعد البيانات وتصميم الواجهات وتطوير الفرونت إند.">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts: Cairo, Tajawal, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Pinned Mermaid JS -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <style>
    /* CSS Custom Properties & Design Tokens */
    :root {
      --font-sans: 'Cairo', 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cairo', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Light Theme Colors */
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;

      --text-main: #0f172a;
      --text-muted: #475569;
      --text-faint: #94a3b8;

      --brand-primary: #1d4ed8;
      --brand-primary-hover: #1e40af;
      --brand-light: #eff6ff;
      --brand-border: #bfdbfe;

      /* Callout Tokens */
      --callout-tip-bg: #f0fdf4;
      --callout-tip-border: #22c55e;
      --callout-tip-text: #14532d;

      --callout-warning-bg: #fffbeb;
      --callout-warning-border: #f59e0b;
      --callout-warning-text: #78350f;

      --callout-note-bg: #f0f9ff;
      --callout-note-border: #0ea5e9;
      --callout-note-text: #0c4a6e;

      --callout-mistake-bg: #fef2f2;
      --callout-mistake-border: #ef4444;
      --callout-mistake-text: #7f1d1d;

      /* Code Block Tokens */
      --code-bg: #0f172a;
      --code-header-bg: #1e293b;
      --code-text: #e2e8f0;
      --code-comment: #94a3b8;
      --code-keyword: #38bdf8;
      --code-string: #4ade80;
      --code-border: #334155;

      /* Layout & Dimensions */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    [data-theme="dark"] {
      --bg-body: #0b0f19;
      --bg-surface: #111827;
      --bg-card: #1f2937;
      --bg-card-subtle: #172033;
      --border-color: #374151;
      --border-focus: #60a5fa;

      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;

      --brand-primary: #3b82f6;
      --brand-primary-hover: #60a5fa;
      --brand-light: #1e293b;
      --brand-border: #1d4ed8;

      --callout-tip-bg: #064e3b;
      --callout-tip-border: #10b981;
      --callout-tip-text: #ecfdf5;

      --callout-warning-bg: #451a03;
      --callout-warning-border: #f59e0b;
      --callout-warning-text: #fef3c7;

      --callout-note-bg: #082f49;
      --callout-note-border: #0284c7;
      --callout-note-text: #e0f2fe;

      --callout-mistake-bg: #450a0a;
      --callout-mistake-border: #ef4444;
      --callout-mistake-text: #fee2e2;

      --code-bg: #030712;
      --code-header-bg: #111827;
      --code-text: #f3f4f6;
      --code-border: #1f2937;
    }

    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.75;
      direction: rtl;
      text-align: right;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* Headings inside content */
    .content-area h1, .content-area h2, .content-area h3, .content-area h4 {
      color: var(--text-main);
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 0.75rem;
    }
    .content-area h1 {
      font-size: 2rem;
      margin-top: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .content-area h2 {
      font-size: 1.45rem;
      margin-top: 1.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .content-area h3 {
      font-size: 1.2rem;
      margin-top: 1.5rem;
    }
    .content-area h4 {
      font-size: 1.02rem;
      margin-top: 1rem;
    }
    .content-area p {
      margin-bottom: 1rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Step Badges and Pills */
    .step-badge-group {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .stage-tag {
      background-color: var(--brand-light);
      color: var(--brand-primary);
      border: 1px solid var(--brand-border);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 800;
    }
    .step-pill {
      background-color: var(--bg-card-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-family: var(--font-sans);
      font-weight: 700;
    }

    .step-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .step-number {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #3b82f6 100%);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }
    .step-title-wrap {
      flex: 1;
      min-width: 0;
    }
    .step-title {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }
    .step-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Callout Boxes */
    .callout {
      border-right: 4px solid;
      border-radius: var(--radius-sm);
      padding: 1.15rem 1.4rem;
      margin: 1.35rem 0;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .callout-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      margin-bottom: 0.45rem;
      font-size: 1rem;
    }
    .callout.tip {
      background-color: var(--callout-tip-bg);
      border-color: var(--callout-tip-border);
      color: var(--callout-tip-text);
    }
    .callout.warning {
      background-color: var(--callout-warning-bg);
      border-color: var(--callout-warning-border);
      color: var(--callout-warning-text);
    }
    .callout.note {
      background-color: var(--callout-note-bg);
      border-color: var(--callout-note-border);
      color: var(--callout-note-text);
    }
    .callout.mistake {
      background-color: var(--callout-mistake-bg);
      border-color: var(--callout-mistake-border);
      color: var(--callout-mistake-text);
    }

    /* Step Cards and Nested Boxes */
    .step-card {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin: 1.5rem 0;
    }

    /* Code Blocks with Copy Button */
    .code-container {
      background-color: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius-md);
      margin: 1.35rem 0;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      direction: ltr;
      text-align: left;
    }
    .code-header {
      background-color: var(--code-header-bg);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--code-border);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .code-lang {
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .copy-btn {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background-color: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }
    .copy-btn.copied {
      background-color: #059669;
      border-color: #10b981;
      color: #ffffff;
    }
    pre.code-content {
      padding: 1.25rem 1.25rem;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--code-text);
      line-height: 1.65;
    }
    pre.code-content code {
      font-family: inherit;
    }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 1.35rem 0;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.92rem;
    }
    table.data-table th, table.data-table td {
      padding: 0.85rem 1.15rem;
      border-bottom: 1px solid var(--border-color);
    }
    table.data-table th {
      background-color: var(--bg-card-subtle);
      font-weight: 800;
      color: var(--text-main);
      font-size: 0.88rem;
    }
    table.data-table tr:last-child td {
      border-bottom: none;
    }
    table.data-table tr:hover td {
      background-color: var(--bg-card-subtle);
    }

    /* Diagram Containers */
    .diagram-box {
      background-color: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: center;
      overflow-x: auto;
    }
    .diagram-box h4 {
      margin-bottom: 1rem;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 800;
    }
    .diagram-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.85rem;
      font-style: italic;
    }

    /* Checklists */
    .checklist-card {
      background-color: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin: 1.25rem 0;
    }
    .checklist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .checklist-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-main);
    }
    .checklist-counter {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--brand-primary);
      background-color: var(--brand-light);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    .checklist-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.92rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .checklist-item input[type="checkbox"] {
      margin-top: 0.3rem;
      accent-color: var(--brand-primary);
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    /* Accordions */
    details.example-accordion {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin: 1rem 0;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    details.example-accordion[open] {
      box-shadow: var(--shadow-sm);
    }
    summary.example-summary {
      padding: 0.9rem 1.25rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-card-subtle);
      user-select: none;
      transition: background-color 0.15s;
    }
    summary.example-summary:hover {
      background-color: var(--border-color);
    }
    .example-tag {
      font-size: 0.75rem;
      background: var(--brand-light);
      color: var(--brand-primary);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    .example-body {
      padding: 1.25rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .topic-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <!-- React App Root Container -->
  <div id="root"></div>

  <!-- React Entry Point -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- Pinned Mermaid initialization helper -->
  <script>
    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default',
        securityLevel: 'loose',
        fontFamily: 'JetBrains Mono, Cairo, Tajawal, sans-serif'
      });
    }
  </script>
</body>
</html>
